<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kavin's Solids</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kavin Solids">
<meta name="theme-color" content="#2a1d17">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f7f1e8; --card:#fffdf9; --ink:#2b2520; --muted:#7a6f64; --line:#e8dfd2;
  --accent:#c4643c; --accent-soft:#f6e1d6; --ok:#4f7d5c; --ok-soft:#dcebdf;
  --warn:#b7791f; --warn-soft:#f8ead0; --bad:#b83a3a; --bad-soft:#f6dada;
  --blue:#3d6a8a; --blue-soft:#dde9f1; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1915;--card:#26221d;--ink:#f1ebe3;--muted:#a99d90;--line:#3a342c;
  --accent:#e08a62;--accent-soft:#3d2a20;--ok:#7fb48d;--ok-soft:#24352a;--warn:#e0a94f;--warn-soft:#3a2f1c;
  --bad:#e57373;--bad-soft:#3d2222;--blue:#86b3d3;--blue-soft:#1f2f3a;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + var(--safe-b));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top h1{font-size:20px;letter-spacing:-.01em}
.top .age{font-size:13px;color:var(--muted)}
.iconbtn{border:0;background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.syncdot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncdot.ok{background:var(--ok)}.syncdot.busy{background:var(--warn)}.syncdot.err{background:var(--bad)}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line)}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .lbl{flex:1;text-align:center}
.daynav .lbl b{display:block;font-size:17px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.new{background:var(--accent);color:#fff}
.pill.build{background:var(--accent-soft);color:var(--accent)}
.pill.keep{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.iron{background:#efe1dc;color:#8a3b2a}
@media (prefers-color-scheme:dark){.pill.iron{background:#3a2621;color:#e7a08c}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meal{display:flex;gap:12px;align-items:flex-start}
.meal .slot{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.meal .txt{font-size:16.5px;font-weight:600;margin-top:2px}
.meal .body{flex:1;min-width:0}
.tick{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:22px;color:transparent;transition:.15s}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.tick.rx{background:var(--bad);border-color:var(--bad);color:#fff}
.banner{border-radius:var(--r);padding:14px;margin-bottom:12px}
.banner.new{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.banner.watch{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.info{background:var(--blue-soft)}
.banner h3{font-size:16px;margin-bottom:6px}
.banner ol,.banner ul{margin:6px 0 0;padding-left:20px}
.banner li{margin:3px 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:18px 2px 8px}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(90deg)}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:0}
.checkline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.checkline:last-child{border-bottom:0}
.checkline input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.dayrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:last-child{border-bottom:0}
.dayrow .d{width:52px;flex:none;font-size:13px;color:var(--muted);line-height:1.2}
.dayrow .d b{display:block;color:var(--ink);font-size:15px}
.dayrow .m{flex:1;min-width:0;font-size:14.5px}
.dayrow.today{background:var(--accent-soft);margin:0 -14px;padding:10px 14px}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:6px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.acard .nm{font-weight:700;font-size:15px;margin:4px 0 6px}
.acard .em{font-size:22px}
.acard.reaction,.acard.s-reaction{border-color:var(--bad);background:var(--bad-soft)}
.acard.overdue{border-color:var(--warn)}
.food{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.food:last-child{border-bottom:0}
.food .nm{flex:1;font-weight:600}
.food .st{font-size:18px;width:26px;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.entry{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.entry:last-child{border-bottom:0}
.entry .t{font-size:13px;color:var(--muted)}
.entry .w{font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;transform:translateY(102%);transition:transform .25s ease;padding:8px 16px calc(20px + var(--safe-b));max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.sheet{visibility:hidden;transition:transform .25s ease,visibility .25s}
a.btn{text-decoration:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding:8px 0}
.sheet .hd h2{flex:1;font-size:19px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.pick{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto;padding:2px}
.pick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13.5px}
.pick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.alert{border-radius:12px;padding:12px;font-size:14.5px;margin:8px 0}
.alert.bad{background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad)}
.alert.warn{background:var(--warn-soft)}
.ladder{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ladder::-webkit-scrollbar{display:none}
.rung{flex:0 0 42%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;box-shadow:var(--shadow)}
.rung b{color:var(--accent);font-size:13px}
.rung strong{display:block;margin:6px 0 4px;font-size:15px;line-height:1.25}
.rung .muted{font-size:13px;line-height:1.35}
.rung.now{border-color:var(--accent);background:var(--accent-soft)}
.rung.past{opacity:.6}
@media (min-width:560px){.rung{flex-basis:30%}}
.cal{flex:none;width:46px;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:center;box-shadow:var(--shadow)}
.cal .cm{display:block;background:#d9453a;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 0}
.cal .cd{display:block;font-size:20px;font-weight:700;line-height:1.35;padding:1px 0 2px}
.cal.past .cm{background:var(--muted)}
.wkcard.cur{border-color:var(--accent)}
.stabs{display:grid;gap:4px;background:var(--line);padding:3px;border-radius:12px;margin-bottom:10px}
.stabs button{border:0;background:none;border-radius:9px;padding:9px 2px;font-size:13.5px;font-weight:600;color:var(--muted);position:relative}
.stabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stabs button i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.recipe .yield{font-size:13.5px;font-weight:600;color:var(--ok);margin-bottom:10px}
.recipe .rh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);margin:10px 0 4px}
.recipe .ing{margin:0;padding-left:20px;font-size:14.5px}
.recipe .ing li{margin:3px 0}
.recipe .how{margin:0;padding-left:20px;font-size:14.5px}
.recipe .how li{margin:6px 0;padding-left:2px}
.pe2{font-size:15px}
.acard{position:relative}
.acard.s-none{opacity:.62;box-shadow:none}
.acard.s-building{border:2px solid var(--accent)}
.acard.s-in{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.abadge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.abadge.bad{background:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.mcard{display:flex;align-items:center;gap:10px;padding:12px}
.mcard .meal{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.mcard.is-done{background:color-mix(in srgb,var(--ok-soft) 45%,var(--card))}
.mi{flex:none;width:58px;height:58px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-size:32px;line-height:1}
.mi.n2,.mi.n3{grid-template-columns:1fr 1fr;font-size:22px;padding:4px;gap:0}
.mi.n3 span:first-child{grid-column:1/-1}
.mi.lg{width:72px;height:72px;font-size:40px}.mi.lg.n2,.mi.lg.n3{font-size:28px}
.mi.sm{width:44px;height:44px;font-size:24px;border-radius:12px}.mi.sm.n2,.mi.sm.n3{font-size:16px}
.mcard .ttl{font-size:17.5px;font-weight:700;letter-spacing:-.01em;margin-top:1px}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.pill.tex{background:var(--blue-soft);color:var(--blue);font-weight:600}
.logged{font-size:13.5px;margin-top:8px;font-weight:600}
.logged .lk{font-size:16px}
.bigemo{font-size:28px}
details.banner summary{list-style:none;cursor:pointer}details.banner summary::-webkit-details-marker{display:none}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:14px}
.rate button span{font-size:34px;line-height:1}
.rate button.on{border-color:var(--accent);background:var(--accent-soft)}
.rate.sm button{padding:10px 4px 8px;font-size:13px}.rate.sm button span{font-size:24px}
.linkbtn{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
.prep{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.prep .pe{font-size:28px;line-height:1}
.prep .pb{flex:1;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.stage{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.stage p{margin:6px 0 0;font-size:14.5px}
.stage.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,var(--card))}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ftile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}
.ftile .fe{font-size:30px;line-height:1.1}
.ftile .fn{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.ftile .fb{position:absolute;top:5px;right:6px;font-size:13px}
.ftile .fi{position:absolute;top:8px;left:8px;width:7px;height:7px;border-radius:50%;background:#b5533a}
.ftile:not(.tried){background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.ftile.tried{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.ftile .fb{background:var(--card);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.dm{display:flex;align-items:center;gap:6px;margin:2px 0;min-width:0}
.dm .de{font-size:17px}.dm .dt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm .dk{margin-left:auto;font-size:14px}.dm.done .dt{color:var(--muted)}
.dm .pill{font-size:11px;padding:2px 7px}
.lkbig{font-size:22px}
.dayrow .chev{transform:none!important}
.daynav .lbl .small{display:block}
details.more{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
details.more summary{font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;margin-bottom:10px}
.hero{background:#2a1d17;color:#fff;padding:calc(var(--safe-t) + 12px) 18px 16px}
.hero .hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:640px;margin:0 auto}
.hvar{display:flex;gap:2px;width:120px;height:6px}.hvar i{display:block;border-radius:2px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.02em;color:#fff;margin:0}
.hero .greet{color:#e6d8ca;font-size:15px;margin-top:4px}
.hbtn{position:relative;border:0;background:rgba(255,255,255,.1);color:#f3e7da;border-radius:12px;width:38px;height:38px;display:grid;place-items:center}
.hbtn .syncdot{top:6px;right:6px}
.agebadge{flex:none;background:#fff;color:#2a1d17;border-radius:18px;padding:8px 14px 7px;text-align:center;line-height:1.05;min-width:76px}
.agebadge b{display:block;font-size:30px;font-weight:700}
.agebadge span{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#c4643c;margin-top:2px}
.agebadge small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#9b8d80;margin-top:1px}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:-2px 0 12px}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.wd .wl{font-size:11px;font-weight:700;color:var(--muted)}
.wd .wc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
.wd .wn{font-size:10px;font-weight:700;color:var(--accent);height:12px;text-transform:uppercase;letter-spacing:.04em}
.wd.part .wc{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.wd.full .wc{background:var(--ok);border-color:var(--ok);color:#fff}
.wd.rx .wc{background:var(--bad);border-color:var(--bad);color:#fff}
.wd.today .wl{color:var(--accent)}
.wd.sel .wc{outline:2.5px solid var(--ink);outline-offset:2px}
.sumcard{padding:12px 14px}.sumrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.fd{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.fd:first-of-type{border-top:0}.fd span:nth-child(2){flex:1;min-width:0}
.av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.av.rt{background:var(--blue-soft);color:var(--blue)}
.rbar{display:flex;gap:3px;height:14px;margin:10px 0 8px}.rbar i{display:block;border-radius:4px}
.rleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.rleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.frzcard{display:block;width:100%;text-align:left;font:inherit}
.frow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.frow:last-child{border-bottom:0}
.fe2{font-size:24px}

.fzc.on{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}

.fzb{border:1px solid var(--line);background:var(--card);border-radius:50%;width:26px;height:26px;line-height:1}

.loc.sm{font-size:11.5px;padding:2px 8px}
.loc-home{background:var(--line)}
.loc-auckland{background:#dcefe4;color:#2f6a48}
.loc-melb{background:#e9e1f3;color:#5b3f86}

@media (prefers-color-scheme:dark){.loc-auckland{background:#1f3328;color:#8fd0a8}.loc-melb{background:#2c2338;color:#c8b2ea}.loc-hotel{background:#3a2f1c;color:#e0a94f}.loc-fiji{background:#18333a;color:#8fd3e2}}
.loc-auckland-t{color:#2f6a48}.loc-melb-t{color:#5b3f86}.loc-hotel-t{color:#8a5a12}.loc-fiji-t{color:#1f6a7c}
@media (prefers-color-scheme:dark){.loc-auckland-t{color:#8fd0a8}.loc-melb-t{color:#c8b2ea}.loc-hotel-t{color:#e0a94f}.loc-fiji-t{color:#8fd3e2}}

.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}

@media print{
  body{padding:0;background:#fff;color:#000}
  .top,nav.tabs,main,.sheet,.scrim,.toast{display:none!important}
  #report{display:block;font:11pt/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#000;padding:0 4mm}

}

<body>
<header class="hero">
  <div class="hrow"><div class="hvar" id="hvar" aria-label="This week's food variety"></div>
  <button class="hbtn" id="btnSettings" aria-label="Settings and sync"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-15.4 6.4M3 12A9 9 0 0 1 18.4 5.6"/><path d="M18 2v4h-4M6 22v-4h4"/></svg><span class="syncdot" id="syncdot"></span></button></div>
  <div class="hrow" style="margin-top:8px"><div style="min-width:0"><h1>Kavin's Solids</h1><div class="greet" id="age"></div></div></div>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-allergens"></section>
  <section class="view" id="v-foods"></section>
  <section class="view" id="v-log"></section>
  <section class="view" id="v-help"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button data-v="allergens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Allergens</button>
  <button data-v="foods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M12 3c1 2 1 4 0 6M8 5c.8 1.5.8 3 0 4M16 5c.8 1.5.8 3 0 4"/></svg>Foods</button>
  <button data-v="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Log</button>
  <button data-v="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>Safety</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="hd"><h2 id="sheetTitle"></h2><button class="iconbtn" id="sheetClose" aria-label="Close">✕</button></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="report"></div>

<script src="plan-data.js"></script>
<script src="recipes.js"></script>
<script>
(() => {
'use strict';
const P = window.PLAN;
const RECIPES = window.RECIPES || {};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
function ageOn(s){
  const b = parse(P.baby.born), d = parse(s);
  let m = (d.getFullYear()-b.getFullYear())*12 + d.getMonth()-b.getMonth();
  let anchor = new Date(b.getFullYear(), b.getMonth()+m, b.getDate());
  if (anchor > d){ m--; anchor = new Date(b.getFullYear(), b.getMonth()+m, b.getDate()); }
  const days = Math.round((d - anchor)/864e5);
  return `${m} months${days ? `, ${days} day${days>1?'s':''}` : ''}`;
}

/* ---------- lookups ---------- */
const AL = Object.fromEntries(P.allergens.map(a => [a.id, a]));
const FOOD = Object.fromEntries(P.foods.map(f => [f.id, f]));
const NUTS = P.allergens.filter(a => a.group === 'nut').map(a => a.id);
const expandAl = ids => { const out = new Set(); (ids||[]).forEach(i => { if (i === 'nutmix'){ NUTS.forEach(n => out.add(n)); out.add('sesame'); } else if (AL[i]) out.add(i); }); return [...out]; };
const SLOTS = { b:{n:'Breakfast', t:'07:45'}, l:{n:'Lunch', t:'11:30'}, a:{n:'Afternoon', t:'16:30'}, d:{n:'Dinner', t:'16:30'}, f:{n:'Finger food', t:'12:00'}, x:{n:'Extra', t:'12:00'} };

function parseMeal(str){
  if (!str) return null;
  const [txt='', fs='', als='', ttl=''] = str.split('|').map(s => s.trim());
  const f = fs.split(',').map(s => s.trim()).filter(Boolean);
  const alk = {};
  als.split(',').map(s => s.trim()).filter(Boolean).forEach(t => { const [id, k] = t.split(':'); alk[id] = k || 'keep'; });
  return { txt, f, al: Object.keys(alk), alk, title: ttl || autoTitle(f) || txt };
}
const KEEPCASE = new Set(['weetbix']);
function autoTitle(f){
  const n = f.filter(x => FOOD[x]).map(x => KEEPCASE.has(x) ? FOOD[x].s : FOOD[x].s);
  if (!n.length) return '';
  const L = n.slice(0, 3).map((x, i) => i && !KEEPCASE.has(f[i]) ? x.charAt(0).toLowerCase() + x.slice(1) : x);
  let t = L.length > 1 ? L.slice(0, -1).join(', ') + ' & ' + L[L.length-1] : L[0];
  if (n.length > 3) t += ` +${n.length-3}`;
  return t;
}
const emojisFor = f => [...new Set((f||[]).map(x => FOOD[x]?.e).filter(Boolean))];
const tileFor = (f, size = '') => { const em = emojisFor(f).slice(0, 3); return `<div class="mi ${size} n${Math.max(1, em.length)}">${(em.length ? em : ['🍽️']).map(x => `<span>${x}</span>`).join('')}</div>`; };
const LIKE = { '1':{i:'👍', n:'Loved it'}, '0':{i:'➖', n:'It was OK'}, '-1':{i:'👎', n:'Not keen'} };
const likeOf = v => v === undefined || v === null ? null : LIKE[String(v)];
function stageFor(s){ if (s < '2026-11-30') return 'pur'; if (s < '2027-01-11') return 'mash'; return 'ff9'; }
const STAGES = {
  pur:  { s:'Purée', n:'Smooth purée', when:'Auckland and weeks 1–2 (until 29 Nov)' },
  mash: { s:'Mashed', n:'Mashed and lumpy', when:'Weeks 3–8 (30 Nov to 10 Jan)' },
  ff:   { s:'Finger food', n:'Finger food he holds', when:'From week 2 (23 Nov). Big pieces, about the size of your finger, so he can grip them' },
  ff9:  { s:'Pieces', n:'Small pieces', when:'From week 9 (11 Jan), once he can pick things up between thumb and finger' }
};

/* Resolve the plan for a date */
function planFor(s){
  const A = P.auckland;
  if (s < A.start) return { type:'before' };
  if (s <= A.end){ const i = diffDays(s, A.start); const day = P.aucklandDays[i];
    return { type:'auckland', tex:'Runny and smooth', label:`Auckland day ${i+1} of 5`, meals: day ? [{slot:'b', ...parseMeal(day.b)}] : [], note: day?.note,
      week:{ title:'Auckland exploration', meals:'Once a day, after his morning feed.', texture:'Smooth, runny purée.', amount:'A few teaspoons. Stop when he turns away.', ff:'None yet.', tips:['No allergens yet. They start the week you get home.','Sit him upright. If there\'s no high chair, sit him upright on a lap facing out.','NZ emergency number is 111. Healthline: 0800 611 116.'] } }; }
  if (s < P.homeStart) return { type:'pause', label:'Travel pause', note: flightOn(s) ? `${flightOn(s).t}. No solids today.` : 'No solids until Monday. Plenty of breastfeeds and rest.' };
  const d = diffDays(s, P.homeStart), wi = Math.floor(d/7), di = d % 7;
  const w = P.weeks[wi];
  if (!w) return { type:'after', label:'Beyond the 12-week plan' };
  const day = w.days[di] || {};
  const meals = [];
  ['b','l','a','d'].forEach(k => { if (day[k]){ const m = parseMeal(day[k]); if (m && m.txt) meals.push({slot:k, ...m}); } });
  const ff = day.ff ? parseMeal(day.ff) : null;
  return { type:'week', tex:w.tex, label:`Week ${w.n} · Day ${di+1}`, week:w, wi, di, meals, ff, note: day.note };
}

/* ---------- state + merge ---------- */
const DEF = { v:1, entries:{}, ticks:{}, foods:{}, freezer:{} };
let S = LS.get('ks_data', null) || structuredClone(DEF);
['entries','ticks','foods','freezer'].forEach(k => S[k] ||= {});
let local = LS.get('ks_local', { name:'Aranei', watch:null });
let cfg = LS.get('ks_sync', { token:'', gist:'' });
const save = () => { LS.set('ks_data', S); scheduleSync(); try { checkMilestones(); } catch {} };
const stamp = o => (o.u = Date.now(), o);
function merge(a, b){
  const out = { v:1, entries:{}, ticks:{}, foods:{}, freezer:{} };
  ['entries','ticks','foods','freezer'].forEach(k => {
    const A = a?.[k] || {}, B = b?.[k] || {};
    new Set([...Object.keys(A), ...Object.keys(B)]).forEach(id => {
      const x = A[id], y = B[id];
      out[k][id] = !x ? y : !y ? x : ((y.u||0) > (x.u||0) ? y : x);
    });
  });
  return out;
}
const live = () => Object.values(S.entries).filter(e => !e.del);

/* ---------- derived ---------- */
function allergenStatus(id, asOf = todayStr()){
  const ex = live().filter(e => expandAl(e.al).includes(id) && e.d <= asOf).sort((a,b) => (a.d+a.t).localeCompare(b.d+b.t));
  const rx = ex.filter(e => e.rx === 'mild' || e.rx === 'severe');
  const last = ex.length ? ex[ex.length-1].d : null;
  const since = last ? diffDays(asOf, last) : null;
  let status = 'none', label = 'Not yet', cls = '';
  if (rx.length){ status = 'reaction'; label = 'Reaction logged'; cls = 'bad'; }
  else if (ex.length >= 3){ status = 'in'; label = 'In his diet'; cls = 'ok'; }
  else if (ex.length){ status = 'building'; label = 'Building up'; cls = 'build'; }
  let due = null;
  if (ex.length && !rx.length){ if (since >= 8) due = 'overdue'; else if (since >= 6) due = 'soon'; }
  return { ex, rx, last, since, status, label, cls, due, first: ex[0]?.d || null };
}
function foodTried(id){
  const ex = live().filter(e => (e.f||[]).includes(id)).sort((a,b) => (a.d+a.t).localeCompare(b.d+b.t));
  const man = S.foods[id];
  const rated = ex.filter(e => e.like !== undefined && e.like !== null);
  const lastRated = rated[rated.length-1];
  let like = man?.like ?? null;
  if (lastRated && (!man || (lastRated.u||0) > (man.u||0))) like = lastRated.like;
  return { tried: ex.length > 0 || !!man?.tried, first: ex[0]?.d || man?.date || null, count: ex.length, like };
}
/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function openSheet(title, html, mount){
  $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop = 0;
  mount && mount($('#sheetBody'));
}
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#scrim').onclick = closeSheet; $('#sheetClose').onclick = closeSheet;

const alPill = (id, kind) => { const a = AL[id]; if (!a && id !== 'nutmix') return '';
  const nm = id === 'nutmix' ? 'Nut mix' : a.name.replace(/ \(.*\)/, '');
  const c = kind === 'new' ? 'new' : kind === 'build' ? 'build' : 'keep';
  const pre = kind === 'new' ? 'NEW · ' : kind === 'build' ? 'Build · ' : '';
  return `<span class="pill ${c}">${pre}${esc(nm)}</span>`; };

/* ---------- views ---------- */
let curDate = todayStr();
let curView = 'today';
function setView(v){
  curView = v; $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-'+v));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  render(); window.scrollTo(0, 0);
}
$$('#tabs button').forEach(b => b.onclick = () => { if (b.dataset.v === 'today' && curView === 'today') curDate = todayStr(); setView(b.dataset.v); });

function renderHero(){
  $('#age').textContent = `${ageOn(todayStr())} old`;
  const mon = mondayOf(todayStr()), c = groupCounts(mon, addDays(mon, 6)), total = Object.values(c).reduce((a, b) => a + b, 0);
  $('#hvar').innerHTML = total ? GROUPS.filter(g => c[g.k]).map(g => `<i style="flex:${c[g.k]};background:${g.c}"></i>`).join('') : '<i style="flex:1;background:rgba(255,255,255,.18)"></i>';
}
function render(){
  renderHero();
  ({ today:renderToday, plan:renderPlan, allergens:renderAllergens, foods:renderFoods, log:renderLog, help:renderHelp })[curView]();
}

/* TODAY */
function entryFor(key){ return Object.values(S.entries).find(e => e.plan === key && !e.del); }
function renderToday(){
  const s = curDate, p = planFor(s), isToday = s === todayStr();
  let h = `<div class="daynav"><button id="dPrev" aria-label="Previous day">‹</button><div class="lbl"><b>${isToday ? 'Today' : fmtLong(s)}</b><span class="small muted">${isToday ? fmtLong(s)+' · ' : ''}${esc(p.label || '')}</span></div><button id="dNext" aria-label="Next day">›</button></div>` + weekStrip(s) + tripCard(s) + summaryCard(s);
  if (!isToday) h += `<div style="text-align:center;margin:-4px 0 12px"><button class="btn ghost sm" id="dToday">Back to today</button></div>`;

  // watch banner
  if (local.watch && Date.now() < local.watch.until){
    const u = new Date(local.watch.until);
    h += `<div class="banner watch"><h3>👀 Watching for a reaction to ${esc(local.watch.name)}</h3><div class="small">Keep an eye on him until <b>${pad(u.getHours())}:${pad(u.getMinutes())}</b>. Hives, swelling, vomiting, or any breathing change: see the Safety tab.</div></div>`;
  }

  if (p.type === 'before'){
    h += `<div class="card"><h3>Not started yet</h3><p class="muted">The Auckland taste days start ${fmtLong(P.auckland.start)}. Use › to look ahead at any day of the plan.</p></div>`;
  } else if (p.type === 'pause'){

const cubeMap = e => Array.isArray(e.cubes) ? Object.fromEntries(e.cubes.map(f => [f, 1])) : (e.cubes || {});

  return c;

  const low = core.reduce((a, b) => c[b] < c[a] ? b : a, core[0]);
  const used = new Set(live().filter(e => e.d >= mon).flatMap(e => e.f || []));
  const ideas = P.foods.filter(f => f.c === low && !used.has(f.id)).sort((a, b) => foodTried(b.id).tried - foodTried(a.id).tried).slice(0, 3);
  const gname = GROUPS.find(g => g.k === low).n.toLowerCase();

const cubesIn = id => { const y = (RECIPES[id]?.pur?.y || '') + ' ' + (RECIPES[id]?.mash?.y || ''); const m = y.match(/(\d+)\s+cubes/); return m ? Number(m[1]) : 0; };
const FREEZABLE = P.foods.filter(f => cubesIn(f.id) > 0).map(f => f.id);
function upcomingFreezable(s, days = 7){
  const need = {};
  for (let i = 0; i < days; i++){ const p = planFor(addDays(s, i)); (p.meals||[]).forEach(m => m.f.forEach(f => { if (FREEZABLE.includes(f)) need[f] = (need[f] || 0) + 1; })); }
  return need;
}
function frzState(id, need){ const n = S.freezer[id]?.n || 0; return !n ? 'empty' : n >= need ? 'ok' : n * 2 >= need ? 'low' : 'short'; }
function frzBar(id, need){
  const n = S.freezer[id]?.n || 0, st = frzState(id, need), segs = Math.max(10, Math.min(16, n));
  return `<div class="fbar">${Array.from({ length: segs }, (_, i) => `<i class="${i < n ? st : ''}"></i>`).join('')}</div>`;
}

  if (!stocked.length && !Object.keys(need).length) return '';
  const top = [...stocked].sort((a, b) => have(b) - have(a)).slice(0, 4);
  return `<button class="card frzcard" id="frz"><div class="between"><b>🧊 Freezer</b><span class="small muted">${stocked.reduce((a, id) => a + have(id), 0)} cubes ›</span></div>
    ${top.map(id => `<div class="fmini"><span>${FOOD[id].e} ${esc(FOOD[id].s)}</span>${frzBar(id, need[id] || 0)}<b>${have(id)}</b></div>`).join('')}
    ${short.length ? `<div class="small" style="margin-top:8px;color:var(--bad)">Cook next: ${short.slice(0, 4).map(id => `${FOOD[id].e} ${esc(FOOD[id].s)}`).join(', ')}</div>` : '<div class="small" style="margin-top:8px;color:var(--ok)">Stocked for the next 7 days</div>'}</button>`;
}
let frzOpenRow = null;
function openFreezer(){
  const need = upcomingFreezable(todayStr()), have = id => S.freezer[id]?.n || 0;
  const short = FREEZABLE.filter(id => (need[id] || 0) > have(id)).sort((a, b) => ((need[b] - have(b)) - (need[a] - have(a))));
  const stocked = FREEZABLE.filter(id => have(id) > 0).sort((a, b) => have(b) - have(a));
  const other = FREEZABLE.filter(id => !short.includes(id) && !stocked.includes(id));
  const edit = id => frzOpenRow === id ? `<div class="fedit"><button class="cbtn" data-dec="${id}" aria-label="One less">−</button><span class="cnt">${have(id)}</span><button class="cbtn" data-inc="${id}" aria-label="One more">+</button><button class="bbtn" data-batch="${id}">I made a batch</button></div>` : '';
  const stockRow = id => `<div class="frow2" data-row="${id}"><div class="frow"><span class="fe2">${FOOD[id].e}</span><span class="fnm">${esc(FOOD[id].s)}</span>${frzBar(id, need[id] || 0)}<b class="fnum">${have(id)}</b></div>${need[id] ? `<div class="tiny muted fneed">Needed this week: ${need[id]}</div>` : ''}${edit(id)}</div>`;
  const html = `
    ${short.length ? `<div class="sec" style="margin-top:0;color:var(--bad)">Cook this weekend</div><div class="card flat" style="padding:4px 12px">${short.map(id => `<div class="frow"><span class="fe2">${FOOD[id].e}</span><div style="flex:1;min-width:0"><b>${esc(FOOD[id].s)}</b><div class="tiny muted">Need ${need[id]}, have ${have(id)}</div></div><button class="bbtn" data-batch="${id}">I made a batch</button></div>`).join('')}</div>` : `<div class="alert small" style="background:var(--ok-soft);margin-top:0">You're stocked for everything in the next 7 days.</div>`}
    <div class="sec">In the freezer</div>
    ${stocked.length ? `<div class="card flat" style="padding:4px 12px">${stocked.map(stockRow).join('')}</div>` : '<div class="small muted">Nothing yet. After a cook-up, tap "I made a batch".</div>'}
    <div class="small" style="margin:6px 2px"><span class="lg ok"></span>enough for the week <span class="lg low"></span>getting low <span class="lg short"></span>not enough</div>
    <details class="card flat" style="padding:10px 12px" ${other.some(id => id === frzOpenRow) ? 'open' : ''}><summary class="between"><b>Other foods (${other.length})</b><span class="chev">›</span></summary>${other.map(stockRow).join('')}</details>
    <p class="tiny muted">Tap a food to fix its count. Cubes come off when you tick a meal, and you can untick them in the rating pop-up if you made it fresh.</p>`;
  openSheet('Freezer', html, root => {
    const upd = (id, n) => { S.freezer[id] = stamp({ n: Math.max(0, n) }); save(); openFreezer(); };
    $$('[data-row]', root).forEach(r => r.onclick = ev => { if (ev.target.closest('button')) return; frzOpenRow = frzOpenRow === r.dataset.row ? null : r.dataset.row; openFreezer(); });
    $$('[data-inc]', root).forEach(b => b.onclick = () => upd(b.dataset.inc, have(b.dataset.inc) + 1));
    $$('[data-dec]', root).forEach(b => b.onclick = () => upd(b.dataset.dec, have(b.dataset.dec) - 1));
    $$('[data-batch]', root).forEach(b => b.onclick = () => openBatch(b.dataset.batch));
  });
}
function openBatch(id){
  const f = FOOD[id]; let n = cubesIn(id) || 6;
  const html = `<div class="row" style="margin:-4px 0 14px">${tileFor([id], 'lg')}<div><b>${esc(f.n)}</b><div class="small muted">How many cubes did you get?</div></div></div>
    <div class="stepper"><button class="cbtn big" id="bM" aria-label="One less">−</button><span id="bN">${n}</span><button class="cbtn big" id="bP" aria-label="One more">+</button></div>
    <div class="small muted" style="text-align:center">The recipe usually makes about ${cubesIn(id)}</div>
    <button class="btn block" id="bAdd" style="margin-top:16px">Add ${n} to the freezer</button>`;
  openSheet('I made a batch', html, root => {
    const upd = () => { $('#bN', root).textContent = n; $('#bAdd', root).textContent = `Add ${n} to the freezer`; };
    $('#bM', root).onclick = () => { n = Math.max(1, n - 1); upd(); };
    $('#bP', root).onclick = () => { n = Math.min(60, n + 1); upd(); };
    $('#bAdd', root).onclick = () => { S.freezer[id] = stamp({ n: (S.freezer[id]?.n || 0) + n }); save(); toast(`🧊 Added ${n} ${f.s.toLowerCase()} cubes`); frzOpenRow = null; openFreezer(); render(); };
  });
}

/* MILESTONES */
function milestones(){
  const es = live().sort((a, b) => (a.d + a.t).localeCompare(b.d + b.t));
  const first = fn => es.find(fn)?.d || null;
  const alFirst = id => allergenStatus(id, '9999-12-31').first;
  const triedDates = P.foods.map(f => foodTried(f.id).first).filter(Boolean).sort();
  const nth = n => triedDates.length >= n ? triedDates[n - 1] : null;
  const byDay = {}; es.forEach(e => { if (['b','l','a','d'].includes(e.slot)) (byDay[e.d] ||= new Set()).add(e.slot); });
  const three = Object.keys(byDay).sort().find(d => byDay[d].size >= 3) || null;
  const days = [...new Set(es.map(e => e.d))].sort(); let streak = null, run = 1;
  for (let i = 1; i < days.length; i++){ run = diffDays(days[i], days[i-1]) === 1 ? run + 1 : 1; if (run >= 7){ streak = days[i]; break; } }
  const allIn = P.allergens.every(a => alFirst(a.id)) ? P.allergens.map(a => alFirst(a.id)).sort().pop() : null;
  const ep = alFirst('egg') && alFirst('peanut') ? [alFirst('egg'), alFirst('peanut')].sort().pop() : null;
  return [
    { id:'first', e:'🥄', n:'First taste', d:first(() => true) },
    { id:'loved', e:'👍', n:'First "loved it"', d:first(e => e.like === 1) },
    { id:'egg', e:'🥚', n:'Egg is in', d:alFirst('egg') },
    { id:'ep', e:'🥜', n:'Egg and peanut in', d:ep },
    { id:'ff', e:'✋', n:'First finger food', d:first(e => e.slot === 'f') },
    { id:'f10', e:'🔟', n:'10 foods tried', d:nth(10) },
    { id:'three', e:'🍽️', n:'Three meals in a day', d:three },
    { id:'streak', e:'🔥', n:'7 days in a row', d:streak },
    { id:'f25', e:'🌈', n:'25 foods tried', d:nth(25) },
    { id:'all', e:'🛡️', n:'All 15 allergens in', d:allIn },
    { id:'rice', e:'🍙', n:"Kavin's first rice ball", d:first(e => /rice ball/i.test(e.title || e.txt || '')) },
    { id:'fall', e:'🏆', n:`All ${P.foods.length} foods tried`, d:nth(P.foods.length) }
  ];
}
function checkMilestones(){
  const seen = new Set(local.badges || []), got = milestones().filter(m => m.d);
  const fresh = got.filter(m => !seen.has(m.id));
  if (local.badges && fresh.length) setTimeout(() => toast(`🏅 New milestone: ${fresh[0].n}`), 700);
  local.badges = got.map(m => m.id); LS.set('ks_local', local);
}
function milestoneStrip(){
  const ms = milestones(), n = ms.filter(m => m.d).length;
  return `<div class="between" style="margin:4px 2px 8px"><span class="sec" style="margin:0">Milestones</span><span class="small muted">${n} of ${ms.length}</span></div>
    <div class="mstrip">${ms.map(m => `<div class="badge ${m.d ? 'got' : ''}"><div class="bc">${m.d ? m.e : '🔒'}</div><div class="bn">${esc(m.n)}</div><div class="bd">${m.d ? fmtDate(m.d).replace(/^\w+ /, '') : ''}</div></div>`).join('')}</div>`;
}

/* ENTRY FORM */

   <div class="field"><label>Allergens in this meal</label><div class="pick" id="fA">${alOpts.map(([id,n]) => `<button type="button" data-id="${id}" class="${x.al.includes(id) ? 'on' : ''}">${esc(n)}</button>`).join('')}</div></div>
   <div class="field"><label>How much</label><div class="seg" id="fAmt">${['taste','some','lots','refused'].map(a => `<button type="button" data-v="${a}" class="${x.amt === a ? 'on' : ''}">${amtLabel(a)}</button>`).join('')}</div></div>

/* PLAN */
function renderPlan(){
  const t = todayStr(), cur = planFor(t);
  let ladderIdx = 0;
  if (cur.type === 'week'){ const n = cur.week.n; ladderIdx = n <= 2 ? 0 : n <= 4 ? 1 : n <= 6 ? 2 : n <= 9 ? 3 : 4; }
  if (cur.type === 'after') ladderIdx = 4;
  let h = `<div class="sec">Texture ladder</div><div class="ladder" id="ladder">${P.textureLadder.map((x,i) => `<div class="rung ${i === ladderIdx ? 'now' : i < ladderIdx ? 'past' : ''}" data-i="${i}"><div class="between"><b>${esc(x.age)}</b>${i === ladderIdx ? '<span class="pill new">Now</span>' : i === ladderIdx + 1 ? '<span class="pill keep">Next</span>' : i < ladderIdx ? '<span class="tiny muted">✓ Done</span>' : ''}</div><strong>${esc(x.label)}</strong><div class="muted">${esc(x.detail)}</div></div>`).join('')}</div>`;
  // Auckland
  h += `<button class="btn ghost block" id="pFrz" style="margin-top:14px">🧊 Freezer and cook-next list</button>` + tripsOverview();
  h += `<div class="sec">Auckland</div>` + weekBlock({ key:'auck', start:P.auckland.start, title:'Auckland exploration', range:`${fmtDate(P.auckland.start)} – ${fmtDate(P.auckland.end)}`, days:P.aucklandDays.map((d,i) => ({ date:addDays(P.auckland.start, i), meals:[{slot:'b', ...parseMeal(d.b)}] })), open: cur.type === 'auckland', info:`<p class="small">Once a day after his morning feed with Only Organic banana porridge, chicken, dhal, pumpkin and beef. No allergens yet. Pause Thu 12 to Sun 15 Nov for the flight home.</p>` });
  h += `<div class="sec">Week by week</div>`;
  P.weeks.forEach((w, wi) => {
    const days = w.days.map((d, di) => { const date = addDays(w.start, di); const p = planFor(date); return { date, meals:p.meals, ff:p.ff }; });
    const end = addDays(w.start, 6);
    h += weekBlock({ key:'w'+w.n, start:w.start, title:`Week ${w.n}: ${w.title}`, range:`${fmtDate(w.start)} – ${fmtDate(end)}`, days, open: cur.type === 'week' && cur.wi === wi, w });
  });
  $('#v-plan').innerHTML = h;
  const lad = $('#ladder'), rn = lad && lad.querySelector(`[data-i="${ladderIdx}"]`); if (rn) lad.scrollLeft = rn.offsetLeft - lad.offsetLeft - 16;
  $('#pFrz').onclick = openFreezer;
  $$('[data-go]', $('#v-plan')).forEach(r => r.onclick = () => { curDate = r.dataset.go; setView('today'); });
  $$('[data-cook]', $('#v-plan')).forEach(c => c.onchange = () => { S.ticks[c.dataset.cook] = stamp({ on:c.checked }); save(); });
}
function weekBlock({ key, start, title, range, days, open, w, info }){
  const t = todayStr();
  let total = 0, done = 0;
  days.forEach(d => { const ms = [...d.meals, ...(d.ff ? [{slot:'f'}] : [])]; total += ms.length; ms.forEach(m => entryFor(`${d.date}:${m.slot}`) && done++); });
  const newAl = []; days.forEach(d => d.meals.forEach(m => Object.entries(m.alk).forEach(([a,k]) => k === 'new' && newAl.push(a))));
  let body = info || '';
  if (w){
    body += `<dl class="kv"><dt>Meals</dt><dd>${esc(w.meals)}</dd><dt>Texture</dt><dd>${esc(w.texture)}</dd><dt>How much</dt><dd>${esc(w.amount)}</dd><dt>Finger food</dt><dd>${esc(w.ff)}</dd></dl>`;
    if (w.cook?.length) body += `<div class="sec" style="margin-top:14px">Cook and prep</div>${w.cook.map((c,i) => { const k = `cook:${key}:${i}`; return `<label class="checkline"><input type="checkbox" data-cook="${k}" ${S.ticks[k]?.on ? 'checked' : ''}><span class="small">${esc(c)}</span></label>`; }).join('')}`;
    if (w.tips?.length) body += `<div class="sec" style="margin-top:14px">Tips</div><ul class="small" style="padding-left:18px;margin:0">${w.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  body += `<div class="sec" style="margin-top:14px">Days</div>` + days.map(d => {
    const ms = d.meals.map(m => { const e = entryFor(`${d.date}:${m.slot}`); const lk = e && likeOf(e.like); return `<div class="dm ${e ? 'done' : ''}"><span class="de">${emojisFor(m.f)[0] || '🍽️'}</span><span class="dt">${esc(m.title)}</span>${Object.entries(m.alk).filter(([,k]) => k === 'new').map(([a]) => `<span class="pill new">${esc(AL[a]?.name.replace(/ \(.*\)/,''))}</span>`).join('')}${e ? `<span class="dk">${lk ? lk.i : '✓'}</span>` : ''}</div>`; }).join('');
    const dl = locOf(d.date), df = flightOn(d.date);
    return `<div class="dayrow ${d.date === t ? 'today' : ''}" data-go="${d.date}"><div class="d"><b>${DOW[parse(d.date).getDay()]}</b>${parse(d.date).getDate()} ${MON[parse(d.date).getMonth()]}</div><div class="m">${df ? `<div class="tiny" style="font-weight:700;color:var(--blue)">✈️ ${esc(df.t)}</div>` : ''}${dl && dl.k !== 'home' ? `<div class="tiny dloc loc-${dl.k}-t">${dl.e} ${esc(dl.sub)}</div>` : ''}${ms}</div><span class="chev">›</span></div>`;
  }).join('');
  const sd = parse(start), past = addDays(start, days.length - 1) < t, isCur = t >= start && t <= addDays(start, days.length - 1);
  return `<details class="card wkcard ${isCur ? 'cur' : ''}" ${open ? 'open' : ''}><summary><div class="row" style="align-items:flex-start"><div class="cal ${past ? 'past' : ''}"><span class="cm">${MON[sd.getMonth()]}</span><span class="cd">${sd.getDate()}</span></div><div style="flex:1;min-width:0"><div class="between"><div><b>${esc(title)}</b><div class="small muted">${esc(range)}${newAl.length ? ' · new: '+newAl.map(a => esc(AL[a]?.name.replace(/ \(.*\)/,''))).join(', ') : ''}</div>${(() => { const seen = []; days.forEach(d => { const l = locOf(d.date); if (l && !seen.some(x => x.k === l.k && x.sub === l.sub)) seen.push(l); }); return seen.length && !(seen.length === 1 && seen[0].k === 'home') ? `<div class="chips" style="margin-top:6px">${seen.map(l => locChip(l, true)).join('')}${days.some(d => flightOn(d.date)) ? '<span class="loc sm loc-fly">✈️ Flight</span>' : ''}</div>` : ''; })()}</div><span class="chev">›</span></div><div class="prog"><i style="width:${total ? Math.round(done/total*100) : 0}%"></i></div><div class="tiny muted" style="margin-top:4px">${done} of ${total} logged</div></div></div></summary>${body}</details>`;
}

/* ALLERGENS */
function renderAllergens(){
  const sts = P.allergens.map(a => ({ a, st:allergenStatus(a.id) }));
  const inDiet = sts.filter(x => x.st.status === 'in' || x.st.status === 'building').length;
  const rx = sts.filter(x => x.st.status === 'reaction');
  let h = `<div class="card"><div class="between"><div><b>${inDiet} of ${P.allergens.length} introduced</b><div class="small muted">Goal: all in by about 7½ months, then each one at least weekly.</div></div><div style="font-size:28px">${inDiet === P.allergens.length ? '🎉' : '🛡️'}</div></div><div class="prog"><i style="width:${Math.round(inDiet/P.allergens.length*100)}%"></i></div></div>`;

/* ---------- SYNC (GitHub Gist) ---------- */
const FILE = 'kavin-solids.json';
let syncT, syncing = false, lastSync = LS.get('ks_lastsync', null), syncErr = '';
function setDot(s){ $('#syncdot').className = 'syncdot ' + s; }
function scheduleSync(){ if (!cfg.token || !cfg.gist) return; clearTimeout(syncT); setDot('busy'); syncT = setTimeout(sync, 1500); }
async function gh(method, path, body){
  const r = await fetch('https://api.github.com' + path, { method, cache:'no-store', headers:{ 'Authorization':'Bearer ' + cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(body ? {'Content-Type':'application/json'} : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok){ let m = r.status + ''; try { m += ' ' + (await r.json()).message; } catch {} throw new Error(m); }
  return r.json();
}
async function pull(){
  const g = await gh('GET', '/gists/' + cfg.gist);
  const f = g.files?.[FILE]; if (!f) return null;
  let txt = f.content;
  if (f.truncated){ txt = await (await fetch(f.raw_url, { cache:'no-store' })).text(); }
  try { return JSON.parse(txt); } catch { return null; }
}
async function sync(){
  if (!cfg.token || !cfg.gist || syncing) return;
  if (!navigator.onLine){ setDot('err'); syncErr = 'Offline. Will sync when you\'re back online.'; return; }
  syncing = true; setDot('busy');
  try {
    const remote = await pull();
    const merged = merge(S, remote);
    const changedRemote = JSON.stringify(merged) !== JSON.stringify(remote);
    S = merged; LS.set('ks_data', S);
    if (changedRemote) await gh('PATCH', '/gists/' + cfg.gist, { files:{ [FILE]:{ content: JSON.stringify(S) } } });
    lastSync = Date.now(); LS.set('ks_lastsync', lastSync); syncErr = ''; setDot('ok');
    if (!$('#sheet').classList.contains('on')) render();
  } catch (e){ syncErr = e.message; setDot('err'); }
  finally { syncing = false; }
}
async function createGist(){
  const g = await gh('POST', '/gists', { description:"Kavin's solids log (synced by the Kavin Solids app)", public:false, files:{ [FILE]:{ content: JSON.stringify(S) } } });
  return g.id;
}

      <li>Copy the token. On the first phone, paste it above, leave Gist ID blank, tap Connect. The app creates a private gist.</li>
      <li>Tap "Copy Gist ID" and send it to the other phone (along with the token, via a secure channel such as AirDrop).</li>
      <li>On the second phone, paste the token and the Gist ID, then tap Connect.</li></ol>
      <p class="tiny muted">The token can only read and write your gists. It stays on each phone and is never synced.</p></details>
   </div>
   <div class="sec">Backup</div>
   <div class="grid2"><button class="btn ghost sm" id="sExp">Export backup</button><label class="btn ghost sm" style="margin:0">Import backup<input type="file" id="sImp" accept="application/json,.json" hidden></label></div>
   <p class="tiny muted" style="margin-top:14px">Plan content from plan-data.js. Data saved on this phone${cfg.gist ? ' and in your private gist' : ''}.</p>`;
  openSheet('Settings and sync', html, root => {
    $$('#sName button', root).forEach(b => b.onclick = () => { $$('#sName button', root).forEach(x => x.classList.toggle('on', x === b)); local.name = b.dataset.v; LS.set('ks_local', local); });
    $('#sConnect', root).onclick = async () => {
      cfg.token = $('#sTok', root).value.trim(); cfg.gist = $('#sGist', root).value.trim().replace(/.*\//, '');
      if (!cfg.token){ toast('Paste your GitHub token first'); return; }
      try {
        if (!cfg.gist){ toast('Creating your private gist…'); cfg.gist = await createGist(); }
        LS.set('ks_sync', cfg); await sync(); toast(syncErr ? 'Sync problem: ' + syncErr : 'Connected and synced ✓'); openSettings();
      } catch (e){ toast('Could not connect: ' + e.message); syncErr = e.message; setDot('err'); }
    };
    $('#sNow', root).onclick = async () => { await sync(); toast(syncErr ? 'Sync problem: ' + syncErr : 'Synced ✓'); openSettings(); };
    $('#sCopy', root) && ($('#sCopy', root).onclick = async () => { try { await navigator.clipboard.writeText(cfg.gist); toast('Gist ID copied'); } catch { prompt('Copy this Gist ID:', cfg.gist); } });
    $('#sOff', root) && ($('#sOff', root).onclick = () => { if (confirm('Disconnect sync on this phone? The log stays on this phone and in the gist.')){ cfg = { token:'', gist:'' }; LS.set('ks_sync', cfg); setDot(''); openSettings(); } });
    $('#sExp', root).onclick = () => download(`kavin-solids-backup-${todayStr()}.json`, JSON.stringify(S, null, 2), 'application/json');
    $('#sImp', root).onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); S = merge(S, d); save(); render(); toast('Backup merged in ✓'); } catch { toast('That file could not be read'); } };
  });
}

/* ---------- boot ---------- */
if (cfg.token && cfg.gist){ setDot('busy'); sync(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ sync(); if (!$('#sheet').classList.contains('on')) render(); } });
window.addEventListener('online', sync);
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
